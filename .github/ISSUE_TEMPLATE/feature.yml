name: 機能の要望 / Feature request
description: こういうことができてほしい、という提案
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        日本語でも英語でも書けます（Japanese or English）。
  - type: textarea
    id: problem
    attributes:
      label: 困っていること・したいこと
      description: どんな場面で、何ができなくて困っているかを書いてください
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: こうなってほしい
      description: 設定やコマンド・記法の案があれば書いてください
  - type: textarea
    id: alternatives
    attributes:
      label: 今の回避策
      description: 今どうやって済ませているか（あれば）
