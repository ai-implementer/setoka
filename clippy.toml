# 出力先と原稿への書き込みの口を縛る（10-12 レビューの R8。v0.22 Phase 106）。
# ファイルシステムの書き込み・削除・作成（std::fs と、jabara が使う tokio::fs）を直に呼ぶと clippy が落とす。
# 書くときは次の口を通す:
#   - 出力先（dist・.setoka）: setoka_core::output の再エクスポート（実体は crate kunenbo。
#     相対パスの字句検証と経路のシンボリックリンクの検査を内包する）
#   - 原稿（fmt・lint --fix）: setoka-cli の commands::rewrite_source
# 許しているのは crate kunenbo（crate 全体）・rewrite_source と一時ファイルの作成・setoka new の雛形の書き出し・
# テストのコードだけ（各 crate のルートの cfg_attr(test, …) と結合テストのファイルの先頭）。mikan は当面
# crates/mikan/clippy.toml でこの設定を外している（次に検索 wasm を作り直すときに消す）。
# allow-invalid = true は、OS や依存によってはそのパスが無い項目（Windows に無い std::os::unix・tokio に依存しない
# crate から見た tokio::fs・kunenbo に依存しない crate から見た kunenbo）に付ける（無いと clippy が警告を出す）
disallowed-methods = [
  { path = "std::fs::write", reason = "出力先は setoka_core::output::write_under、原稿は commands::rewrite_source を通す" },
  { path = "std::fs::remove_file", reason = "setoka_core::output::remove_file_under（経路のリンクを検査する）を通す" },
  { path = "std::fs::remove_dir", reason = "出力先の掃除は setoka_core::output::remove_orphans を通す" },
  { path = "std::fs::remove_dir_all", reason = "setoka_core::output::remove_dir_all_under（経路のリンクを検査する）を通す" },
  { path = "std::fs::rename", reason = "原稿は commands::rewrite_source、出力先は setoka_core::output::write_atomic_under を通す" },
  { path = "std::fs::copy", reason = "読み込んで setoka_core::output::write_under で書く" },
  { path = "std::fs::create_dir", reason = "setoka_core::output::create_dir_all_under（経路のリンクを検査する）を通す" },
  { path = "std::fs::create_dir_all", reason = "setoka_core::output::create_dir_all_under（経路のリンクを検査する）を通す" },
  { path = "std::fs::DirBuilder::create", reason = "setoka_core::output::create_dir_all_under（経路のリンクを検査する）を通す" },
  { path = "std::fs::File::create", reason = "出力先は setoka_core::output::write_under、原稿は commands::rewrite_source を通す" },
  { path = "std::fs::File::create_new", reason = "出力先は setoka_core::output::write_under、原稿は commands::rewrite_source を通す" },
  { path = "std::fs::OpenOptions::open", reason = "出力先は setoka_core::output::write_under、原稿は commands::rewrite_source を通す" },
  { path = "std::fs::hard_link", reason = "出力先と原稿にリンクを作らない（中身は setoka_core::output::write_under で書く）" },
  { path = "std::fs::soft_link", reason = "出力先と原稿にリンクを作らない（中身は setoka_core::output::write_under で書く）" },
  { path = "std::fs::set_permissions", reason = "リンクを辿って権限を変える。原稿の権限は commands::rewrite_source が引き継ぐ" },
  { path = "std::os::unix::fs::symlink", reason = "出力先と原稿にリンクを作らない（中身は setoka_core::output::write_under で書く）", allow-invalid = true },
  { path = "std::os::windows::fs::symlink_file", reason = "出力先と原稿にリンクを作らない（中身は setoka_core::output::write_under で書く）", allow-invalid = true },
  { path = "std::os::windows::fs::symlink_dir", reason = "出力先と原稿にリンクを作らない（中身は setoka_core::output::write_under で書く）", allow-invalid = true },
  { path = "tokio::fs::write", reason = "出力先は setoka_core::output::write_under を通す", allow-invalid = true },
  { path = "tokio::fs::remove_file", reason = "setoka_core::output::remove_file_under を通す", allow-invalid = true },
  { path = "tokio::fs::remove_dir", reason = "出力先の掃除は setoka_core::output::remove_orphans を通す", allow-invalid = true },
  { path = "tokio::fs::remove_dir_all", reason = "setoka_core::output::remove_dir_all_under を通す", allow-invalid = true },
  { path = "tokio::fs::rename", reason = "出力先は setoka_core::output::write_atomic_under を通す", allow-invalid = true },
  { path = "tokio::fs::copy", reason = "読み込んで setoka_core::output::write_under で書く", allow-invalid = true },
  { path = "tokio::fs::create_dir", reason = "setoka_core::output::create_dir_all_under を通す", allow-invalid = true },
  { path = "tokio::fs::create_dir_all", reason = "setoka_core::output::create_dir_all_under を通す", allow-invalid = true },
  { path = "tokio::fs::DirBuilder::create", reason = "setoka_core::output::create_dir_all_under を通す", allow-invalid = true },
  { path = "tokio::fs::File::create", reason = "出力先は setoka_core::output::write_under を通す", allow-invalid = true },
  { path = "tokio::fs::File::create_new", reason = "出力先は setoka_core::output::write_under を通す", allow-invalid = true },
  { path = "tokio::fs::OpenOptions::open", reason = "出力先は setoka_core::output::write_under を通す", allow-invalid = true },
  { path = "tokio::fs::hard_link", reason = "出力先と原稿にリンクを作らない", allow-invalid = true },
  { path = "tokio::fs::symlink", reason = "出力先と原稿にリンクを作らない", allow-invalid = true },
  { path = "tokio::fs::set_permissions", reason = "リンクを辿って権限を変える", allow-invalid = true },
  # 経路を検査せずに書く（kunenbo の中で write_under が使う下請け）。setoka_core::output からは再エクスポートしない
  { path = "kunenbo::write_if_changed", reason = "経路を検査しない。setoka_core::output::write_under を通す", allow-invalid = true },
]
