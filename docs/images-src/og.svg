<!-- docs/public/images/og.png（共有カード 1200×630）の元。v0.21 Phase 94 で文字を setoka にして描き直した。
     PNG への書き出しは resvg で行った（resvg 0.50.0: resvg docs/images-src/og.svg docs/public/images/og.png） -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1d35"/>
      <stop offset="1" stop-color="#142a4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1c8" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#fff1c8" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff1c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fruit" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fcd456"/>
      <stop offset="0.55" stop-color="#ecac1c"/>
      <stop offset="1" stop-color="#cf8e0a"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa646"/>
      <stop offset="1" stop-color="#3f7a2c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1110" cy="590" r="250" fill="#1b345a" opacity="0.55"/>
  <circle cx="330" cy="335" r="300" fill="url(#glow)"/>

  <!-- 実 -->
  <circle cx="330" cy="335" r="190" fill="url(#fruit)" stroke="#b8860b" stroke-width="8"/>
  <ellipse cx="262" cy="248" rx="58" ry="34" fill="#ffffff" opacity="0.22" transform="rotate(-32 262 248)"/>
  <circle cx="270" cy="280" r="11" fill="#fff6d0" opacity="0.25"/>
  <g fill="#fbe39a" opacity="0.6">
    <circle cx="352" cy="242" r="6"/>
    <circle cx="410" cy="300" r="7"/>
    <circle cx="225" cy="318" r="5"/>
    <circle cx="430" cy="368" r="6"/>
    <circle cx="240" cy="372" r="7"/>
    <circle cx="382" cy="394" r="10"/>
    <circle cx="313" cy="412" r="8"/>
    <circle cx="282" cy="452" r="6"/>
    <circle cx="368" cy="470" r="5"/>
  </g>
  <!-- へたと葉 -->
  <path d="M330 150 C 326 136 328 122 334 110" stroke="#4a7c2f" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="330" cy="150" r="13" fill="#4a7c2f"/>
  <path d="M338 120 C 380 70 450 64 488 86 C 450 120 390 136 338 120 Z" fill="url(#leaf)"/>
  <path d="M345 117 C 390 100 440 92 478 88" stroke="#2f5f20" stroke-width="2.5" fill="none" opacity="0.6"/>

  <!-- ワードマーク setoka（線で描く。x の高さ 130・ベースライン 390） -->
  <!-- 実と画像の右端との余白をそろえるため、文字の中心（859, 292）を基準に 94% に縮める -->
  <g fill="none" stroke="#fff3d6" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" transform="translate(51.54 17.52) scale(0.94)">
    <!-- s（左端 558・右端 620） -->
    <path d="M618 283 C 612 266 602 260 589 260 C 572 260 560 271 560 290 C 560 312 584 317 594 321 C 610 327 620 336 620 356 C 620 377 606 390 588 390 C 572 390 562 382 558 370"/>
    <!-- e（658〜744） -->
    <path d="M658 325 H 744 A 43 65 0 1 0 729 375"/>
    <!-- t（782〜822） -->
    <path d="M796 195 V 355 Q 796 390 822 388"/>
    <path d="M782 262 H 820"/>
    <!-- o（860〜944） -->
    <ellipse cx="902" cy="325" rx="42" ry="65"/>
    <!-- k（982〜1040） -->
    <path d="M982 190 V 390"/>
    <path d="M1038 262 L 984 333"/>
    <path d="M1004 314 L 1040 390"/>
    <!-- a（1078〜1160） -->
    <ellipse cx="1118" cy="325" rx="40" ry="65"/>
    <path d="M1160 262 V 390"/>
  </g>

  <!-- Markdown → ブラウザ -->
  <g fill="none" stroke="#8fa8d0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="700" y="540" width="94" height="58" rx="8"/>
