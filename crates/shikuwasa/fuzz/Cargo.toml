# shikuwasa の fuzzing ハーネス（cargo-fuzz / nightly 必須。fuzz.yml が週 1 回実行する）。
# ルート workspace の members glob（crates/*）は 1 階層のみのため、
# 空の [workspace] で独立 workspace にしている（cargo-fuzz の標準形）
[package]
name = "shikuwasa-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
shikuwasa = { path = "..", features = ["json"] }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[workspace]
