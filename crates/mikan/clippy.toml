# mikan はファイルへ書かない（native と wasm で共有する検索エンジン。I/O は setoka-index が持つ）ので、
# 当面はワークスペースの clippy.toml の書き込みの口の縛り（v0.22 Phase 106）を掛けない。clippy はいちばん近い
# clippy.toml だけを読むので、このファイルがある間はルートの設定は mikan に届かない。
# ソース側に allow を書かないのは、src と Cargo.toml が検索 wasm の入力のハッシュ（scripts/build-search-wasm.sh）に
# 入っていて、テストのための属性 1 つでも wasm の作り直しが要るため。
# 次に検索 wasm を作り直すとき（vaporetto 0.7 への更新か mikan の版上げ）に、lib.rs に
# `#![cfg_attr(test, allow(clippy::disallowed_methods))]` を足してこのファイルを消す（ROADMAP「その他の候補」）。
# mikan の publish には版上げ＝wasm の作り直しが要るので、このファイルは配布物に入れない
